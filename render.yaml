services:
  - type: web
    name: digital-time-machine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: AI_PROVIDER
        value: "openai"
      - key: AI_REQUEST_TIMEOUT
        value: "25"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "1024"

